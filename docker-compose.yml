services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lambari_games
      POSTGRES_USER: lambari
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente antes de iniciar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lambari -d lambari_games"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
